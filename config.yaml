openai:
  environment:
    OPENAI_TIMEOUT: 10m
    OPENAI_BASE_URL: http://192.168.1.231:8080/v1
    OPENAI_API_KEY: your_api_key_here

state:
  definition: modules/mcp-tool-state/state.json

mcp:
